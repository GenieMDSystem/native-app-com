<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waiting Room</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #f8fafc; }
        h1 { font-size: 1.4rem; margin: 0 0 8px; }
        p { color: #94a3b8; margin: 0 0 20px; }
        button { width: 100%; padding: 14px; margin-bottom: 12px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .primary { background: #38bdf8; color: #0f172a; }
        .secondary { background: transparent; color: #34d399; border: 1px solid #34d399; }
        .status { margin-top: 12px; font-size: 0.85rem; color: #94a3b8; word-break: break-all; }
        code { font-size: 0.75rem; color: #38bdf8; }
    </style>
</head>
<body>
    <h1>Waiting Room</h1>
    <p>Type <code>1</code> — waiting room callback</p>

    <button class="primary" type="button" onclick="goInWebView()">
        Continue in WebView (openInBrowser: false)
    </button>
    <button class="secondary" type="button" onclick="goInBrowser()">
        Open URL in Mobile Browser (openInBrowser: true)
    </button>
    <button class="secondary" type="button" onclick="sendFailure()">
        Simulate failure (success: false)
    </button>

    <p id="status" class="status"></p>

<script>
    const TYPE_WAITING_ROOM = 1;

    function callNative(payload) {
        const json = JSON.stringify(payload);
        document.getElementById("status").textContent = "Sent: " + json;
        if (window.NativeApp && window.NativeApp.callback) {
            window.NativeApp.callback(json);
        } else {
            alert("Native bridge not available.");
        }
    }

    function goInWebView() {
        callNative({
            type: TYPE_WAITING_ROOM,
            data: {
                url: "https://example.com",
                success: true,
                openInBrowser: false
            }
        });
    }

    function goInBrowser() {
        callNative({
            type: TYPE_WAITING_ROOM,
            data: {
                url: "https://example.com",
                success: true,
                openInBrowser: true
            }
        });
    }

    function sendFailure() {
        callNative({
            type: TYPE_WAITING_ROOM,
            data: {
                url: "https://example.com",
                success: false,
                openInBrowser: false
            }
        });
    }
</script>
</body>
</html>
