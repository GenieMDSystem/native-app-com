<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule Visit</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #f8fafc; }
        h1 { font-size: 1.4rem; margin: 0 0 8px; }
        p { color: #94a3b8; margin: 0 0 20px; }
        button { width: 100%; padding: 14px; margin-bottom: 12px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .primary { background: #38bdf8; color: #0f172a; }
        .secondary { background: transparent; color: #34d399; border: 1px solid #34d399; }
        .status { margin-top: 12px; font-size: 0.85rem; color: #94a3b8; word-break: break-all; }
        code { font-size: 0.75rem; color: #38bdf8; }
    </style>
</head>
<body>
    <h1>Schedule Visit</h1>
    <p>Type <code>2</code> — close WebView and return to home when <code>success</code> or <code>close</code> is true</p>

    <button class="primary" type="button" onclick="closeWithSuccess()">
        Close with success: true
    </button>
    <button class="secondary" type="button" onclick="closeWithCloseFlag()">
        Close with close: true
    </button>

    <p id="status" class="status"></p>

<script>
    const TYPE_SCHEDULE = 2;

    function callNative(payload) {
        const json = JSON.stringify(payload);
        document.getElementById("status").textContent = "Sent: " + json;
        if (window.NativeApp && window.NativeApp.callback) {
            window.NativeApp.callback(json);
        } else {
            alert("Native bridge not available.");
        }
    }

    function closeWithSuccess() {
        callNative({ type: TYPE_SCHEDULE, data: { success: true } });
    }

    function closeWithCloseFlag() {
        callNative({ type: TYPE_SCHEDULE, data: { close: true } });
    }
</script>
</body>
</html>
