<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedules List</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 24px; background: #0f172a; color: #f8fafc; }
        h1 { font-size: 1.4rem; margin: 0 0 8px; }
        p { color: #94a3b8; margin: 0 0 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .card h2 { margin: 0 0 6px; font-size: 1rem; }
        .card span { color: #94a3b8; font-size: 0.85rem; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; background: #38bdf8; color: #0f172a; }
        .status { margin-top: 16px; font-size: 0.85rem; color: #94a3b8; word-break: break-all; }
        code { font-size: 0.75rem; color: #38bdf8; }
    </style>
</head>
<body>
    <h1>Schedules List</h1>
    <p>Type <code>3</code> — open schedule link in browser</p>

    <div class="card">
        <h2>Dr. Smith — Follow-up</h2>
        <span>Tomorrow · 10:00 AM</span>
        <button type="button" onclick="openScheduleLink('https://example.com/schedule/1', true)">
            Open in Mobile Browser
        </button>
        <button type="button" style="background:#34d399;margin-top:8px"
                onclick="openScheduleLink('https://example.com/schedule/1', false)">
            Open in WebView
        </button>
    </div>

    <div class="card">
        <h2>Dr. Patel — Consult</h2>
        <span>Friday · 2:30 PM</span>
        <button type="button" onclick="openScheduleLink('https://example.com/schedule/2', true)">
            Open in Mobile Browser
        </button>
    </div>

    <p id="status" class="status"></p>

<script>
    const TYPE_OPEN_SCHEDULE_LINK = 3;

    function callNative(payload) {
        const json = JSON.stringify(payload);
        document.getElementById("status").textContent = "Sent: " + json;
        if (window.NativeApp && window.NativeApp.callback) {
            window.NativeApp.callback(json);
        } else {
            alert("Native bridge not available.");
        }
    }

    function openScheduleLink(url, openInBrowser) {
        callNative({
            type: TYPE_OPEN_SCHEDULE_LINK,
            data: {
                url: url,
                success: true,
                openInBrowser: openInBrowser
            }
        });
    }
</script>
</body>
</html>
